name = "whitefox-ai"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".vercel/output/static"

# Cloudflare D1 数据库绑定说明：
# 若已创建 D1 数据库，可在 Cloudflare Pages 项目设置 -> Settings -> Functions -> D1 database bindings 中添加绑定，
# 变量名为 DB，指向您的 D1 数据库。
# 或取消下方注释并填写您的 database_id：
# [[d1_databases]]
# binding = "DB"
# database_name = "whitefox_db"
# database_id = "YOUR_D1_DATABASE_ID"
